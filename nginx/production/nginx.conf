# nginx/production/nginx.conf
# Docker用　本番用

# ■■ upstreamブロック: Puma（Railsアプリ）への接続先を定義
upstream app {
    # "app" はアップストリームの名前（任意）。コンテナ名と対応させると分かりやすいです。
    # Pumaサーバーへの接続設定【 ①UNIXソケット or ②TCPポート 】
    # ------------------------------------
    # ①本番ではUNIXソケットを使用（高速で安全）し、Dockerでは共有ボリューム上のsockファイルを指定します。
    server unix:///app/tmp/sockets/puma.sock;    # （Pumaが出力するソケットファイルへのパス）
    # ------------------------------------
    # ②TCPポート経由で接続する場合（例: Pumaがポート3000で待ち受け）
    # Docker Composeではサービス名(app)がホスト名として解決され、appコンテナの3000番ポートを指します:contentReference[oaicite:8]{index=8}。
    #server app:3000;
}

# 1) HTTP(80) → 非www HTTPS(443) へのリダイレクト
#   HTTP（80）到来時は必ず「非wwwのHTTPS」へ正規化リダイレクト
server {
    # Nginxが待ち受けるポート番号（80番をHTTP用に開放）
    listen      80;
    server_name example.com www.example.com;
    #return      308 https://$host$request_uri;
    return      308 https://example.com$request_uri;
}

# 2) www HTTPS(443) → 非www HTTPS(443) へのリダイレクト（ドメイン正規化）
#    www の HTTPS に来た場合も「非www」へ正規化（クッキー分断防止）
server {
    listen 443 ssl;
    server_name www.example.com;

    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;

    return 308 https://example.com$request_uri;
}

# 3) 非www HTTPS の本番用サーバーブロック（正規ホスト）
server {
    # Nginxが待ち受けるポート番号（443番をHTTPS用に開放）
    #listen 443 ssl http2;       # HTTP/2 対応
    listen 443 ssl;             # ポーリング対策として http2 を無効にする
    # 本番環境　自分のドメイン名やサーバーIPアドレスに変更:contentReference[oaicite:9]{index=9}
    server_name example.com;

    # ログ出力先の設定（任意で設定。デフォルトは/var/log/nginx下のaccess.logとerror.log）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 接続維持時間の設定（必要に応じて調整）
    keepalive_timeout 5;

    # SSL 証明書
    # Let’s Encrypt の秘密鍵 (privkey.pem) と、フルチェイン証明書 (fullchain.pem) のパスを指定
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;

    # SSL/TLS設定（強化されたプロトコル設定）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 24h;

    # 基本的なセキュリティヘッダーを追加 => クリックジャッキングなどを防ぐ効果
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Let's Encryptの認証用ディレクトリへのアクセスを許可（SSL証明書の自動更新のため）
    location /.well-known/acme-challenge/ {
      allow all;
      root /var/www/certbot;        # Certbotがホスト上に作成する検証ファイルの格納位置（Nginxコンテナが参照する）
    }

    # ドキュメントルート
    # 静的ファイル公開ディレクトリ／Railsアプリのpublicディレクトリへのパスを絶対パスで指定します。
    root /app/public;       # Railsのpublicフォルダ。ここに静的ファイル(画像やJS,CSS、404.html等)が置かれる

    # アップロードサイズ上限の調整（大きなファイルアップロード時のエラー防止）
    client_max_body_size 100m;

    # カスタムエラーページの指定／Railsのpublic/404.htmlや500.htmlが存在すればエラーページとして利用
    error_page 404             /404.html;
    error_page 500 502 503 504 /500.html;

    # PHP リクエストを即時ドロップするルールを追加（.php を一切 Rails に渡さない）
    location ~* \.php$ {
        return 444;    # 444 は「接続をそのまま切断」
    }

    # アセットのキャッシュ設定
    # 静的ファイル（画像・CSS・JS）は Nginx が直接配信
    # Railsが生成するアセット（CSS, JavaScriptファイルなど）に対して、ブラウザに長期間キャッシュさせる設定を追加 →　開発中のページ表示がさらに高速になる。
    location ~ ^/(assets|packs)/ {
        gzip_static on;         # 事前圧縮された .gz ファイルがあればそれを配信
        expires    30d;                         # ブラウザキャッシュ 30 日
        add_header Cache-Control public;
    }
    #location ~* \.(css|js|png|jpg|jpeg|gif|svg)$ {
    #    gzip_static on;         # 事前圧縮された .gz ファイルがあればそれを配信
    #    expires    30d;                         # ブラウザキャッシュ 30 日
    #    add_header Cache-Control public;
    #}

    # Action Cable (WebSocket) 用のプロキシ設定
    location /cable {
        proxy_pass http://app;                              # upstream ブロックの “app” を再利用
        # WebSocketプロトコルを扱うための必須設定
        proxy_http_version 1.1;                             # WebSocket には HTTP/1.1
        # WebSocketへのアップグレードを許可
        proxy_set_header Upgrade            $http_upgrade;  # 必須: Upgrade ヘッダ
        proxy_set_header Connection         "Upgrade";      # 必須: Connection ヘッダ
        # Railsにクライアントの情報を正しく伝えるためのヘッダー
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        #proxy_set_header X-Forwarded-Port   $server_port;
        # タイムアウト（必要に応じて延長可）
        #proxy_read_timeout 60s;
    }

    # Railsアプリケーション本体へのプロキシ設定
    # Rails へのリクエスト振り分け
    # まず静的ファイル探す: ファイルまたはフォルダが存在すればそれを返し、無ければ @app（Puma）へフォワード
    location / {
        try_files $uri @app;
        #try_files $uri $uri/index.html @app;
        # "/assets"等特定パスを明示せず、すべてのパスで一旦チェックします
    }

    # Puma (Rack アプリ) へリクエストを転送（Puma へのプロキシ設定）
    # リバースプロキシ関連のヘッダー定義
    location @app {
        # upstreamで定義した "app" (Puma) にリクエストを転送/（upstream名 "app" に紐づけ）
        proxy_pass http://app;          # リクエストをバックエンドの"Puma (app)"に転送:contentReference[oaicite:11]{index=11}

        proxy_redirect     off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;

        # Railsにクライアントの情報を正しく伝えるためのヘッダー
        # クライアントのIPやホスト情報をPumaに伝えるための設定
        proxy_set_header Host               $host;                      # バックエンドに元のHostヘッダーを渡す／クライアントがリクエストしたHostヘッダ(ドメイン)を渡す
        proxy_set_header X-Real-IP          $remote_addr;               # ●クライアントのIPアドレスを保持:contentReference[oaicite:10]{index=10}
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for; # ●バックエンドにクライアントのIPアドレスを伝える／多段プロキシでも元IPが分かるようにする
        proxy_set_header X-Forwarded-Host   $host;                      # バックエンドに正しいホスト名を伝える
        proxy_set_header X-Forwarded-Proto  $scheme;                    # バックエンドにhttp/httpsの別を伝える
        #proxy_set_header X-Forwarded-Port   $server_port;

        # セッションCookieの属性を明示（念押し）
        # 注意: proxy_cookie_flagsディレクティブはRails側のsession_store.rbと競合しやすいため、
        # コメントアウトのままにしておくのが安全です。Cookieの属性はRails側で管理することを推奨します。
        #proxy_cookie_flags _micropost7_session HttpOnly Secure SameSite=None;  # Cookieが書き込まれないため使わない
    }

}
