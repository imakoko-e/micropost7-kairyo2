# nginx/development/nginx.conf
# Docker用　開発用

# ■■ upstreamブロック: Puma（Railsアプリ）への接続先を定義
upstream app {
    # "app" はアップストリームの名前（任意）。コンテナ名と対応させると分かりやすいです。
    # Pumaサーバーへの接続設定【 ①UNIXソケット or ②TCPポート 】
    # ------------------------------------
    # ①本番ではUNIXソケットを使用（高速で安全）し、Dockerでは共有ボリューム上のsockファイルを指定します。
    server unix:///app/tmp/sockets/puma.sock;    # （Pumaが出力するソケットファイルへのパス）
    # ------------------------------------
    # ②TCPポート経由で接続する場合（例: Pumaがポート3000で待ち受け）
    # Docker Composeではサービス名(app)がホスト名として解決され、appコンテナの3000番ポートを指します:contentReference[oaicite:8]{index=8}。
    #server app:3000;
}

server {
    # ●Nginxが待ち受けるポート番号（80番をHTTP用に開放）
    listen 80;
    # 開発中はブラウザから「http://localhost」でアクセスすることを想定しサーバー名をlocalhostに設定
    server_name localhost;

    # 基本的なセキュリティヘッダーを追加 => クリックジャッキングなどを防ぐ効果
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # 静的ファイル公開ディレクトリ／Railsアプリのpublicディレクトリへのパスを絶対パスで指定します。
    root /app/public;       # ◎Railsのpublicフォルダ。ここに静的ファイル(画像やJS,CSS、404.html等)が置かれる
    index index.html;       # ディレクトリアクセス時に返すデフォルトのファイル名

    # 静的ファイル配信: ファイルまたはフォルダが存在すればそれを返し、無ければ @app（Puma）へフォワード
    location / {
        try_files $uri $uri/index.html @app;
        #try_files $uri/index.html $uri @app;
        # "/assets"等特定パスを明示せず、すべてのパスで一旦チェックします
    }

    # 静的ファイル（画像・CSS・JS）は Nginx が直接配信
    # Railsが生成するアセット（CSS, JavaScriptファイルなど）に対して、ブラウザに長期間キャッシュさせる設定を追加 →　開発中のページ表示がさらに高速になる。
    # 本番環境では効果的だが、開発環境ではエラー発生のため使わない
#    location ~ ^/(assets|packs)/ {
#        root /srv/micropost7-kairyo2/public;
#        gzip_static on;         # 事前圧縮された .gz ファイルがあればそれを配信
#        expires 1y;             # max;         # ブラウザに1年間キャッシュさせる
#        add_header Cache-Control public;
#    }

    # Puma (Rack アプリ) へリクエストを転送
    location @app {
        # リバースプロキシ先の定義（upstream名 "app" に紐づけ）
        proxy_pass http://app;          # リクエストをバックエンドの"Puma (app)"に転送:contentReference[oaicite:11]{index=11}

        # 以下のヘッダは、クライアントのIPやホスト情報をPumaに伝えるための設定
        proxy_set_header Host $host;                   # クライアントがリクエストしたHostヘッダ(ドメイン)を渡す
        proxy_set_header X-Real-IP $remote_addr;       # ●クライアントのIPアドレスを保持:contentReference[oaicite:10]{index=10}
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # ●多段プロキシでも元IPが分かるようにする
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_set_header X-Forwarded-Port $server_port;
        #proxy_read_timeout 300;
        #proxy_redirect     off;
    }

    # ログ出力先の設定（任意で設定。デフォルトは/var/log/nginx下のaccess.logとerror.log）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 接続維持時間の設定（必要に応じて調整）
    keepalive_timeout 5;

    # アップロードサイズ上限の調整（大きなファイルアップロード時のエラー防止）
    client_max_body_size 100m;

    # カスタムエラーページの指定／Railsのpublic/404.htmlや500.htmlが存在すればエラーページとして利用
    error_page 404             /404.html;
    error_page 500 502 503 504 /500.html;

    # --- ここからWebSocket用の設定を追加 ---
    location /cable {
        proxy_pass http://app;              # upstream app を再利用
        # WebSocketプロトコルを扱うための必須設定
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # クライアントの情報を正しくRailsに伝えるための設定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_set_header X-Forwarded-Port $server_port;
    }
    # --- ここまで追加 ---

}
