# PostgreSQL Client Authentication Configuration File     # PostgreSQLクライアント認証設定ファイル
#                   (hba = host-based authentication )    # ホストベース認証
# ===================================================
#
# Refer to the "Client Authentication" section in the PostgreSQL documentation for a complete description of this file.
# A short synopsis follows.
# このファイルの詳細については、PostgreSQL ドキュメントの「クライアント認証」セクションを参照してください。
# 以下に簡単な概要を示します。
#
# ----------------------
# Authentication Records       認証レコード
# ----------------------
#
# This file controls: which hosts are allowed to connect, how clients are authenticated, which PostgreSQL user names they can use, which databases they can access.
# Records take one of these forms:
# このファイルは、接続を許可するホスト、クライアントの認証方法、クライアントが使用できる PostgreSQL ユーザー名、クライアントがアクセスできるデータベースを制御します。
# レコードは次のいずれかの形式になります。
#
# local         DATABASE  USER  METHOD  [OPTIONS]
# host          DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostssl       DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostnossl     DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostgssenc    DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostnogssenc  DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
#
# (The uppercase items must be replaced by actual values.)
# (大文字の項目は実際の値に置き換える必要があります。)
#
# The first field is the connection type:   # 最初のフィールドは接続タイプです:
# - "local" is a Unix-domain socket
# - "host" is a TCP/IP socket (encrypted or not)
# - "hostssl" is a TCP/IP socket that is SSL-encrypted
# - "hostnossl" is a TCP/IP socket that is not SSL-encrypted
# - "hostgssenc" is a TCP/IP socket that is GSSAPI-encrypted
# - "hostnogssenc" is a TCP/IP socket that is not GSSAPI-encrypted
#
# DATABASE can be "all", "sameuser", "samerole", "replication", a database name, a regular expression (if it starts with a slash (/)) or a comma-separated list thereof.
# The "all" keyword does not match "replication".
# Access to replication must be enabled in a separate record (see example below).
# DATABASE には、「all」、「sameuser」、「samerole」、「replication」、データベース名、正規表現（スラッシュ (/) で始まる場合）、またはこれらのカンマ区切りのリストを指定できます。
# 「all」キーワードは「replication」には一致しません。
# レプリケーションへのアクセスは別のレコードで有効にする必要があります（以下の例を参照）。
#
# USER can be "all", a user name, a group name prefixed with "+", a regular expression (if it starts with a slash (/)) or a comma-separated list thereof.
# In both the DATABASE and USER fields you can also write a file name prefixed with "@" to include names from a separate file.
# USER には、「all」、ユーザー名、「+」で始まるグループ名、正規表現（スラッシュ (/) で始まる場合）、またはそれらのカンマ区切りのリストを指定できます。
# DATABASE フィールドと USER フィールドの両方に、「@」で始まるファイル名を記述して、別のファイルから名前を含めることもできます。
#
# ADDRESS specifies the set of hosts the record matches.
# It can be a host name, or it is made up of an IP address and a CIDR mask that is an integer (between 0 and 32 (IPv4) or 128 (IPv6) inclusive) that specifies the number of significant bits in the mask.
# A host name that starts with a dot (.) matches a suffix of the actual host name.
# Alternatively, you can write an IP address and netmask in separate columns to specify the set of hosts.
# Instead of a CIDR-address, you can write "samehost" to match any of the server's own IP addresses, or "samenet" to match any address in any subnet that the server is directly connected to.
# ADDRESS は、レコードが一致するホストのセットを指定します。
# ホスト名、または IP アドレスと CIDR マスク (マスクの有効ビット数を指定する整数 (0 から 32 (IPv4) または 128 (IPv6)) で構成されます。
# ドット (.) で始まるホスト名は、実際のホスト名のサフィックスと一致します。
# または、IP アドレスとネットマスクを別々の列に記述して、ホストのセットを指定することもできます。
# CIDR アドレスの代わりに、サーバー自身の IP アドレスのいずれかに一致する場合は「samehost」、サーバーが直接接続されているサブネットのいずれかのアドレスに一致する場合は「samenet」と記述できます。
#
# METHOD can be "trust", "reject", "md5", "password", "scram-sha-256", "gss", "sspi", "ident", "peer", "pam", "ldap", "radius" or "cert".
# Note that "password" sends passwords in clear text; "md5" or "scram-sha-256" are preferred since they send encrypted passwords.
# METHOD には、「trust」、「reject」、「md5」、「password」、「scram-sha-256」、「gss」、「sspi」、「ident」、「peer」、「pam」、「ldap」、「radius」、「cert」のいずれかを指定できます。
# 「password」はパスワードを平文で送信することに注意してください。「md5」または「scram-sha-256」は暗号化されたパスワードを送信するため、推奨されます。
#
# OPTIONS are a set of options for the authentication in the format NAME=VALUE.
# The available options depend on the different authentication methods -- refer to the "Client Authentication" section in the documentation for a list of which options are available for which authentication methods.
# OPTIONS は、NAME=VALUE の形式で認証に使用するオプションのセットです。
# 使用可能なオプションは認証方法によって異なります。どの認証方法でどのオプションが使用できるかは、ドキュメントの「クライアント認証」セクションを参照してください。
#
# Database and user names containing spaces, commas, quotes and other special characters must be quoted.
# Quoting one of the keywords "all", "sameuser", "samerole" or "replication" makes the name lose its special character, and just match a database or username with that name.
# スペース、カンマ、引用符、その他の特殊文字を含むデータベース名とユーザー名は、引用符で囲む必要があります。
# キーワード「all」、「sameuser」、「samerole」、「replication」のいずれかを引用符で囲むと、名前の特殊文字が失われ、その名前を持つデータベースまたはユーザー名のみが一致します。
#
# ---------------
# Include Records    # レコードのインクルード
# ---------------
#
# This file allows the inclusion of external files or directories holding more records, using the following keywords:
# このファイルでは、以下のキーワードを使用して、追加のレコードを保持する外部ファイルまたはディレクトリをインクルードできます。
#
# include           FILE
# include_if_exists FILE
# include_dir       DIRECTORY
#
# FILE is the file name to include, and DIR is the directory name containing the file(s) to include.
# Any file in a directory will be loaded if suffixed with ".conf".  The files of a directory are ordered by name.
# include_if_exists ignores missing files.  FILE and DIRECTORY can be specified as a relative or an absolute path, and can be double-quoted if they contain spaces.
# FILE はインクルードするファイル名、DIR はインクルードするファイルを含むディレクトリ名です。
# ディレクトリ内のファイルは、末尾に「.conf」が付いている場合にロードされます。ディレクトリ内のファイルは名前順に並べられます。
# include_if_exists は存在しないファイルを無視します。FILE と DIRECTORY は相対パスまたは絶対パスで指定でき、スペースを含む場合は二重引用符で囲むことができます。
#
# -------------
# Miscellaneous     # その他
# -------------
#
# This file is read on server startup and when the server receives a SIGHUP signal.
# If you edit the file on a running system, you have to SIGHUP the server for the changes to take effect, run "pg_ctl reload", or execute "SELECT pg_reload_conf()".
# このファイルは、サーバーの起動時と、サーバーが SIGHUP シグナルを受信した際に読み込まれます。
# 実行中のシステムでファイルを編集した場合、変更を有効にするにはサーバーに SIGHUP を送信するか、「pg_ctl reload」を実行するか、「SELECT pg_reload_conf()」を実行する必要があります。
#
# ----------------------------------
# Put your actual configuration here     # 実際の設定をここに記入してください
# ----------------------------------
#
# If you want to allow non-local connections, you need to add more "host" records.
# In that case you will also need to make PostgreSQL listen on a non-local interface via the listen_addresses configuration parameter, or via the -i or -h command line switches.
# 非ローカル接続を許可する場合は、「ホスト」レコードを追加する必要があります。
# その場合、listen_addresses 設定パラメータ、または -i または -h コマンドラインスイッチを使用して、PostgreSQL が非ローカルインターフェースで listen するように設定する必要もあります。

# CAUTION: Configuring the system for local "trust" authentication allows any local user to connect as any PostgreSQL user, including the database superuser.
# If you do not trust all your local users, use another authentication method.
# 注意: システムをローカル「trust」認証用に設定すると、データベーススーパーユーザーを含むすべてのローカルユーザーが任意の PostgreSQL ユーザーとして接続できるようになります。
# すべてのローカルユーザーを信頼しない場合は、別の認証方法を使用してください。

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
# "local" は Unix ドメインソケット接続のみに使用されます
#local   all             all                                     trust
#local   all             postgres                                peer
# UNIXソケット経由（psql -U postgres など）の全ユーザーをパスワード認証で接続を許可
# local   all             all                                     md5
local   all             all                                     scram-sha-256

# IPv4 local connections:   # IPv4 ローカル接続:
#host    all             all             127.0.0.1/32            trust
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:   # IPv6 ローカル接続:
#host    all             all             ::1/128                 trust
host    all             all             ::1/128                 scram-sha-256

# -----------------------
# Allow replication connections from localhost, by a user with the replication privilege.
# レプリケーション権限を持つユーザーによる、localhost からのレプリケーション接続を許可します。
#local   replication     all                                     trust
local   replication     all                                     peer
#host    replication     all             127.0.0.1/32            trust
host    replication     all             127.0.0.1/32            scram-sha-256
#host    replication     all             ::1/128                 trust
host    replication     all             ::1/128                 scram-sha-256
# -----------------------

# カスタムの外部アクセス制御ルールを追加
# 自分のPCのSSL接続を許可（PCのグローバルIPアドレスが変わるため、暫定）
#hostssl   all           all             203.0.113.10/32        md5

# Docker 内 Rails コンテナ (172.18.0.x => 172.18.0.0/16) からのTCP接続（非SSL接続）をパスワード認証で許可
#host      all           all             172.18.0.0/16           md5
host      all           all             172.18.0.0/16           scram-sha-256

# それ以外の非SSL接続は拒否
hostnossl all           all             0.0.0.0/0               reject
# -----------------------
# 必要に応じたデフォルトの catch-all ルール
#host    all             all             all                     scram-sha-256
#host    all             all             0.0.0.0/0               md5
# 以下は使わない
#host    all             all             127.0.0.1/32            md5
