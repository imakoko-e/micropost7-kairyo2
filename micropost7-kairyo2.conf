# /etc/nginx/sites-available/micropost7-kairyo2.conf
# ローカルの開発環境用

# ■■ upstreamブロック: Puma（Railsアプリ）への接続先を定義
upstream micropost7-kairyo2 {
    # "app" はアップストリームの名前（任意）。コンテナ名と対応させると分かりやすいです。
    # Pumaサーバーへの接続設定【 ①UNIXソケット or ②TCPポート 】
    # ------------------------------------
    # ①Unixソケットを使う場合は:
    server unix:/srv/micropost7-kairyo2/tmp/sockets/puma.sock;
    # ②Pumaをローカルの3000番ポートで稼働させている場合:contentReference[oaicite:18]{index=18}。
    #server 0.0.0.0:3000;
    ## server 127.0.0.1:3000;
}

server {
    # ●Nginxが待ち受けるポート番号（80番をHTTP用に開放）
    listen 80;
    # 開発中はブラウザから「http://localhost」でアクセスすることを想定しサーバー名をlocalhostに設定
    server_name localhost;

    # Railsアプリのpublicディレクトリへのパスを絶対パスで指定します。
    root /srv/micropost7-kairyo2/public;

    # ログ出力先の設定（任意で設定。デフォルトは/var/log/nginx下のaccess.logとerror.log）
    access_log /var/log/nginx/micropost7-kairyo2_access.log;
    error_log  /var/log/nginx/micropost7-kairyo2_error.log;

    # アップロードサイズ上限の調整（大きなファイルアップロード時のエラー防止）
    client_max_body_size 50m;

    # カスタムエラーページの指定／Railsのpublic/404.htmlや500.htmlが存在すればエラーページとして利用
    error_page 404             /404.html;
    error_page 500 502 503 504 /500.html;

    # リバースプロキシの設定：Puma (@app) への転送
    location / {
        # 静的ファイル配信: ファイルまたはフォルダが存在すればそれを返し、無ければRails(Puma)へ
        try_files $uri/index.html $uri @rails;
        # "/assets"等特定パスを明示せず、すべてのパスで一旦チェックします

        # リバースプロキシ先の定義（upstream名 "micropost7-kairyo2" に紐づけ）
        # 以下のヘッダは、クライアントのIPやホスト情報をPumaに伝えるための設定
        proxy_set_header X-Real-IP $remote_addr;       # ●クライアントのIPアドレスを保持:contentReference[oaicite:10]{index=10}
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # ●多段プロキシでも元IPが分かるようにする
        proxy_set_header Host $http_host;              # クライアントがリクエストしたHostヘッダ(ドメイン)を渡す
        proxy_pass http://micropost7-kairyo2;          # リクエストをバックエンドの"Puma (app)"に転送:contentReference[oaicite:11]{index=11}
        # 上記で定義した upstream micropost7-kairyo2 にルーティングします。
    }
}
